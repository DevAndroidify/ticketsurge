# Local infrastructure for TicketSurge.
# Run through the npm scripts (npm run infra:up) so the root .env is used.
# Secrets come from .env; ${VAR:?} makes Compose fail fast when a required value is missing.

name: ${COMPOSE_PROJECT_NAME:-ticketsurge}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Redis only holds temporary state; PostgreSQL is the source of truth (see docs/architecture.md).
    # No persistence: a restart starts empty, and `npm run redis:rebuild` restores sold seats and
    # booked holds from PostgreSQL.
    command:
      ['sh', '-c', 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no']
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - '${KAFKA_HOST_PORT:-9092}:9092'
    environment:
      # Single combined broker + controller node in KRaft mode (no ZooKeeper).
      # Fixed KRaft cluster ID (base64-encoded UUID) so the data volume survives restarts.
      CLUSTER_ID: eaDgrgGbRKm3CDCcLkegrQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by containers (Kafka UI); HOST is used by services running on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Local setting: replication factor 1. Production-style: replication factor 3 with
      # min.insync.replicas=2, so acks=all survives the loss of one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      # Topics are created explicitly by a script, so typos cannot create stray topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep the JVM small; the WSL VM has limited memory.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      # The image defaults to /tmp/kraft-combined-logs, which is lost whenever the container is
      # recreated. Store the log on the named volume instead.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Asks the broker for its API versions, which only succeeds once it serves requests.
      test:
        [
          'CMD-SHELL',
          'KAFKA_HEAP_OPTS="-Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    # kafbat/kafka-ui is the maintained continuation of provectuslabs/kafka-ui.
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_HOST_PORT:-8080}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      JAVA_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ---------- Monitoring ----------

  # Consumer lag comes from Kafka itself: committed offset vs log end offset per group and partition.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    depends_on:
      kafka:
        condition: service_healthy
    command: ['--kafka.server=kafka:19092']
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    depends_on:
      - kafka-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    ports:
      - '${PROMETHEUS_HOST_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # The Node services run on the host (WSL); this name lets Prometheus reach them.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    depends_on:
      - prometheus
    ports:
      - '${GRAFANA_HOST_PORT:-3002}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
